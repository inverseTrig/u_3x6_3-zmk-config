name: Draw keymap

on:
  push:
    branches: [main]
    paths:
      - 'config/**.keymap'
      - '.github/workflows/draw-keymap.yml'
      - 'keymap_drawer.yaml'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Parse and draw keymap
        run: |
          keymap parse -z config/u_3x6_3.keymap > /tmp/keymap.yaml
          keymap draw --qmk-keyboard crkbd/rev1 /tmp/keymap.yaml > keymap.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keymap.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update keymap drawing [skip ci]"
            git push
          fi
